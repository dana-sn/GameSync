<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GameSync</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 40px;
        background: #111827;
        color: #e5e7eb;
    }

    h1 {
        font-size: 34px;
        margin: 0 0 8px;
        color: #ffffff;
        letter-spacing: -1px;
    }

    .subtitle {
        color: #9ca3af;
        margin: 0 0 30px;
        font-size: 15px;
    }

    .apps {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        align-items: stretch;
    }

    .panel {
        flex: 1;
        min-width: 280px;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .panel h2 {
        margin: 0 0 8px;
        font-size: 21px;
        color: #ffffff;
    }

    .panel p {
        display: inline-block;
        color: #c4b5fd;
        background: #312e81;
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 12px;
        margin: 5px 0 20px;
    }

    input {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #4b5563;
        border-radius: 7px;
        background: #111827;
        color: #ffffff;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #818cf8;
    }

    input::placeholder {
        color: #9ca3af;
    }

    button {
        padding: 10px 14px;
        margin: 5px 4px 5px 0;
        border: 1px solid #6366f1;
        border-radius: 7px;
        background: #4f46e5;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }

    button:hover {
        background: #6366f1;
    }

    .panel h3 {
        color: #d1d5db;
        font-size: 15px;
        margin-top: 28px;
        padding-bottom: 10px;
        border-bottom: 1px solid #374151;
    }

    ul {
        padding-left: 20px;
        color: #d1d5db;
    }

    li {
        padding: 7px 0;
        margin: 3px 0;
    }

    #log {
        background: #1f2937;
        border: 1px solid #374151;
        border-left: 4px solid #818cf8;
        border-radius: 8px;
        padding: 18px;
        min-height: 75px;
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    body > h2 {
        margin-top: 35px;
        font-size: 20px;
        color: #ffffff;
    }

    @media (max-width: 650px) {
        body {
            padding: 20px;
        }

        .panel {
            min-width: 100%;
        }
    }
</style>
</head>
<body>

    <h1>GameSync</h1>
    <p class="subtitle">Two-way synchronization of video game catalogues</p>

    <div class="apps">
        <div class="panel">
            <h2>Application A</h2>
            <p>Port: 8000</p>

            <input id="titleA" placeholder="Game title">
            <input id="genreA" placeholder="Genre">

            <button onclick="addGame('A')">Add game</button>
            <button onclick="syncGames('A')">Sync to B</button>

            <h3>Games</h3>
            <ul id="listA"></ul>
        </div>

        <div class="panel">
            <h2>Application B</h2>
            <p>Port: 8001</p>

            <input id="titleB" placeholder="Game title">
            <input id="genreB" placeholder="Genre">

            <button onclick="addGame('B')">Add game</button>
            <button onclick="syncGames('B')">Sync to A</button>

            <h3>Games</h3>
            <ul id="listB"></ul>
        </div>
    </div>

    <h2>Integration status / log</h2>
    <div id="log">Ready. Waiting for action...</div>

    <script>
        const API_KEY = "gamesync-secret-123";

        const urls = {
            A: "http://127.0.0.1:8000",
            B: "http://127.0.0.1:8001"
        };

        function showLog(message) {
            const log = document.getElementById("log");
            log.textContent =
                new Date().toLocaleTimeString() + " - " + message +
                "\n" + log.textContent;
        }

        async function loadGames(side) {
            try {
                const response = await fetch(urls[side] + "/games");

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const games = await response.json();
                const list = document.getElementById("list" + side);
                list.innerHTML = "";

                games.forEach(game => {
                    const item = document.createElement("li");
                    item.textContent = game.title + " (" + game.genre + ")";
                    list.appendChild(item);
                });
            } catch (error) {
                showLog("Application " + side + " is unavailable.");
            }
        }

        async function addGame(side) {
            const title = document.getElementById("title" + side).value.trim();
            const genre = document.getElementById("genre" + side).value.trim();

            if (!title || !genre) {
                showLog("Enter both game title and genre.");
                return;
            }

            try {
                const response = await fetch(urls[side] + "/games", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-api-key": API_KEY
                    },
                    body: JSON.stringify({
                        title: title,
                        genre: genre
                    })
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                document.getElementById("title" + side).value = "";
                document.getElementById("genre" + side).value = "";

                showLog("Game added to Application " + side + ": " + title);
                await loadGames(side);

            } catch (error) {
                showLog("Could not add game. Check that Application " +
                    side + " is running.");
            }
        }

        async function syncGames(side) {
            const destination = side === "A" ? "B" : "A";

            try {
                showLog("Synchronizing Application " + side +
                    " to Application " + destination + "...");

                const response = await fetch(urls[side] + "/sync", {
                    method: "POST"
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.detail || "Synchronization failed"
                    );
                }

                showLog("Success: " + result.message +
                    ". Games processed: " + result.count);

                await loadGames("A");
                await loadGames("B");

            } catch (error) {
                showLog("Synchronization failed: " + error.message);
            }
        }

        loadGames("A");
        loadGames("B");
    </script>

</body>
</html>
